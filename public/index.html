<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progressive Era Live • Multiplayer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(135deg,#11142d,#27366c);color:white;min-height:100vh}main{max-width:850px;margin:0 auto;padding:36px 18px}h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.sub{color:#cad2ff}.card{background:#ffffff12;border:1px solid #ffffff30;border-radius:18px;padding:24px;margin-top:24px;box-shadow:0 10px 30px #0002}input,button{font:inherit;border-radius:10px;padding:13px 16px}input{background:#fff;color:#16172d;border:0;max-width:100%;width:100%;margin:7px 0 14px}button{border:0;background:#53e5ba;color:#0a2230;font-weight:800;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#c9d1ff}button:disabled{opacity:.5;cursor:default}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hide{display:none}.code{font-size:46px;letter-spacing:8px;font-weight:900}.question{font-size:clamp(23px,4vw,34px);font-weight:750}.muted{color:#cdd4f8}.score{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ffffff22}.status{font-size:20px;font-weight:700}.pill{display:inline-block;background:#ffffff22;padding:8px 14px;border-radius:30px}.timer{font-size:25px;font-weight:900;color:#ffdc82}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>🏆 Progressive Era Live</h1><p class="sub">48 open-ended questions • Play together from different devices • Live scores</p><div id="entry" class="card"><label>Your player name<input id="name" maxlength="22" placeholder="Your name"></label><div class="row"><div><h3>Host a game</h3><button id="create">Create Room</button></div><div><h3>Join a friend</h3><input id="codeInput" placeholder="6-digit room code" maxlength="6" inputmode="numeric"><button id="join">Join Room</button></div></div></div><div id="game" class="hide"><div class="card"><span class="pill">Room code</span><div id="code" class="code"></div><p class="muted">Share the website URL and room code with your friends.</p><div id="stage" class="status"></div><p id="count" class="muted"></p><div id="prompt" class="question"></div><form id="answerForm" class="hide"><input id="answer" placeholder="Type your answer..." autocomplete="off" maxlength="250" required><button id="submit" type="submit">Submit Answer</button></form><p id="feedback"></p><div id="hostButtons" class="hide"><button id="start">Start Game</button><button id="reveal" class="secondary hide">Reveal Answer</button><button id="next" class="hide">Next Question →</button></div></div><div class="card"><h2>🏅 Live Scoreboard</h2><div id="scores"></div></div></div><p id="error" style="color:#ffb5b5"></p></main><script src="/socket.io/socket.io.js"></script><script>
const s=io();let host=false,latest=null,submitted=false;const $=id=>document.getElementById(id);function msg(t){$('error').textContent=t;}function enter(res){if(res.error){msg(res.error);return;}host=res.host;$('entry').classList.add('hide');$('game').classList.remove('hide');$('hostButtons').classList.toggle('hide',!host);msg('');}
$('create').onclick=()=>s.emit('create',{name:$('name').value},enter);$('join').onclick=()=>s.emit('join',{code:$('codeInput').value.trim(),name:$('name').value},enter);$('start').onclick=()=>s.emit('start');$('next').onclick=()=>s.emit('next');$('reveal').onclick=()=>s.emit('reveal');
$('answerForm').onsubmit=e=>{e.preventDefault();s.emit('answer',$('answer').value,res=>{if(res.error){msg(res.error);return;}submitted=true;$('feedback').textContent=res.correct?'✅ Correct! Points earned.':'❌ Not quite. Answer: '+res.expected;$('answerForm').classList.add('hide');});};
s.on('state',st=>{const changed=!latest||st.index!==latest.index||st.phase!==latest.phase;latest=st;$('code').textContent=st.code;$('scores').replaceChildren();st.players.forEach((p,i)=>{const row=document.createElement('div');row.className='score';const l=document.createElement('span');l.textContent=(i+1)+'. '+p.name+(p.answered?' ✓':'');const r=document.createElement('b');r.textContent=p.score+' pts';row.append(l,r);$('scores').append(row);});if(changed){$('feedback').textContent='';if(st.phase==='question'){submitted=false;$('answer').value='';}}$('count').textContent=st.index>=0?'Question '+(st.index+1)+' / '+st.total:'';$('prompt').textContent=st.question||'';$('answerForm').classList.toggle('hide',st.phase!=='question'||submitted);$('start').classList.toggle('hide',st.phase!=='lobby');$('reveal').classList.toggle('hide',st.phase!=='question');$('next').classList.toggle('hide',st.phase!=='reveal');if(st.phase==='lobby')$('stage').textContent='Waiting for players...';if(st.phase==='question')$('stage').textContent='✍️ Type your answer';if(st.phase==='reveal'){$('stage').textContent='📣 Correct answer: '+st.answer;$('prompt').textContent='';}if(st.phase==='done'){$('stage').textContent='🎉 Game finished! Winner: '+(st.players[0]?.name||'Nobody');$('prompt').textContent='';} });setInterval(()=>{if(latest?.phase==='question'){$('stage').textContent='✍️ Type your answer • ⏱️ '+Math.max(0,Math.ceil((latest.endAt-Date.now())/1000))+'s';}},250);
s.on('disconnect',()=>msg('Disconnected. Refresh to reconnect; your room may need to be recreated.'));
</script></body></html>
